{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <link rel="stylesheet" href="{% static 'app1/styles.css' %}">
</head>
<body>
    <main class="page-shell form-shell">
        <a class="back-link" href="{% url 'dashboard' %}">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19 12H5m7 7-7-7 7-7"></path>
            </svg>
            Employee directory
        </a>
        <section class="form-heading">
            <h1>Add employee</h1>
        </section>
        <form class="employee-form" method="POST">
            {% csrf_token %}
            <div class="form-grid">
                <div class="field">
                    <label for="name">Full name</label>
                    <input id="name" type="text" name="name" placeholder="e.g. Jordan Lee" required>
                </div>
                <div class="field">
                    <label for="email">Email address</label>
                    <input id="email" type="email" name="email" placeholder="name@company.com" required>
                </div>
                <div class="field">
                    <label for="department">Department</label>
                    <select id="department" name="department" required>
                        <option value="">Select department</option>
                        <option value="IT">IT</option>
                        <option value="HR">HR</option>
                        <option value="Sales">Sales</option>
                        <option value="Finance">Finance</option>
                    </select>
                </div>
                <div class="field">
                    <label for="salary">Salary</label>
                    <input id="salary" type="number" name="salary" placeholder="Annual salary" required>
                </div>
                <div class="field">
                    <label for="joining_date">Joining date</label>
                    <input id="joining_date" type="date" name="joining_date" required>
                </div>
            </div>
            <div class="form-actions">
                <a class="button button-light" href="{% url 'dashboard' %}">Cancel</a>
                <button class="button button-primary" type="submit">Save employee</button>
            </div>
        </form>
    </main>
</body>
</html>
